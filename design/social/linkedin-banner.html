<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<!-- 1584x396 LinkedIn banner. The profile photo covers the left on desktop and the middle on
     phones, so the words sit on the right. -->
<style>html,body{width:1584px;height:396px}
body{display:flex;justify-content:flex-end;align-items:center;padding-right:90px;background:var(--ground);position:relative}
.band{position:absolute;left:0;top:0;bottom:0;width:520px;background:var(--tint)}
.band img{position:absolute;left:150px;top:60px;width:270px;opacity:.9}
.copy{display:grid;gap:14px;text-align:right;position:relative}
h1{font-size:60px;line-height:1.05}
.eyebrow{font-size:18px}
.sub{font-size:24px;font-weight:700;color:var(--muted)}</style>
<div class="band"><img src="../../public/brand/logo/sprout-green.svg" alt=""></div>
<div class="copy">
  <div class="eyebrow">Former registered dietitian · Certified Diabetes Educator</div>
  <h1 class="serif">Health coaching in Cantonese<br>for women over 40</h1>
  <div class="sub">Sosan Hua · Simply Sosan</div>
</div>
