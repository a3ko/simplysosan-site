<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<!-- 1080x1920 Instagram story, wordmark set: a new episode. Top 250px and bottom 300px stay
     clear of anything important. -->
<style>html,body{width:1080px;height:1920px}
body{display:flex;flex-direction:column}
.photo{height:1060px;background:url(../../public/img/sosan-kitchen.jpg) 50% 22%/cover;position:relative}
.photo img{position:absolute;left:70px;top:290px;width:340px;background:rgba(247,248,244,.92);padding:22px 28px;border-radius:24px}
.copy{flex:1;padding:60px 90px 300px;display:grid;align-content:center;gap:34px}
.tag{justify-self:start;background:var(--sprout);color:var(--ink);font-weight:800;font-size:30px;letter-spacing:.06em;text-transform:uppercase;padding:12px 26px;border-radius:999px}
.zh.title{font-size:76px;line-height:1.25}
.en{font-size:44px;line-height:1.25}
.cta{font-size:36px;font-weight:800;color:var(--deep)}</style>
<div class="photo"><img src="../../public/brand/logo/wordmark-stacked.svg" alt=""></div>
<div class="copy">
  <div class="tag">New episode · 最新一集</div>
  <div class="zh title">骨質疏鬆<br>只靠走路並不足夠</div>
  <div class="en jost">Ep. 39 · Walking alone isn’t enough for osteoporosis</div>
  <div class="cta">Listen on Apple Podcasts, Spotify or YouTube</div>
</div>
