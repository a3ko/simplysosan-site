<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<!-- 1080x1920 Instagram story: a new episode. The top 250px and bottom 300px sit under the
     app's own controls, so nothing that matters goes there. -->
<style>html,body{width:1080px;height:1920px}
body{display:flex;flex-direction:column}
.photo{height:1060px;background:url(../../public/img/sosan-kitchen.jpg) 50% 22%/cover}
.copy{flex:1;padding:60px 90px 300px;display:grid;align-content:center;gap:34px;background:var(--ground)}
.tag{justify-self:start;background:var(--sprout);color:var(--ink);font-weight:800;font-size:30px;letter-spacing:.06em;text-transform:uppercase;padding:12px 26px;border-radius:999px}
.zh.title{font-size:76px;line-height:1.25;color:var(--ink)}
.en{font-size:40px;font-weight:700;color:var(--muted);line-height:1.3}
.cta{font-size:38px;font-weight:800;color:var(--deep);line-height:1.3}</style>
<div class="photo"></div>
<div class="copy">
  <div class="tag">New episode · 最新一集</div>
  <div class="zh title">骨質疏鬆<br>只靠走路並不足夠</div>
  <div class="en">Ep. 39 · Walking alone isn’t enough for osteoporosis</div>
  <div class="cta">Listen on Apple Podcasts, Spotify or YouTube</div>
</div>
