<!-- 1080x1350 Instagram post: one tip, one sentence. Swap the eyebrow, the headline and the
     Chinese line for each post; the episode is Ep. 38 of the podcast. -->
<style>html,body{width:1080px;height:1350px}
body{display:grid;grid-template-rows:1fr auto}

.eyebrow{font-size:26px}
h1{font-size:112px;line-height:1.03;letter-spacing:-.005em}
.zh{font-size:50px;color:var(--muted);line-height:1.35}
.foot{display:flex;justify-content:space-between;align-items:center;padding:36px 90px;background:var(--deep);color:#fff;font-size:28px;font-weight:800}
.foot span:last-child{color:var(--sprout)}</style>
<div class="top">
  <img class="mark" src="../../public/brand/logo/sprout-green.svg" alt="">
  <div class="eyebrow">Bone health after 40</div>
  <h1 class="serif">Calcium alone isn’t enough to protect your bones.</h1>
  <div class="zh">單靠補鈣，並不足夠保護你的骨骼。</div>
</div>
<div class="foot"><span>Simply Sosan Podcast · Ep. 38</span><span>simplysosan.com</span></div>
